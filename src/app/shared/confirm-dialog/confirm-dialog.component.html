<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-text">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-ghost" (click)="cancel()">{{ data.cancelText || 'Cancel' }}</button>
  <button [class]="data.danger ? 'btn-danger' : 'btn-cta'" (click)="confirm()">
    {{ data.confirmText || 'Confirm' }}
  </button>
</mat-dialog-actions>
