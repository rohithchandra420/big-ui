<div class="sidebar">

  <!-- Logo block -->
  <div class="sidebar-logo">
    <div class="logo-name">Bloom in Green</div>
    <div class="logo-sub">BiG 6.0 · Jan 16–18</div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <div class="nav-group-label">Main</div>

    <a class="nav-item"
       routerLink="/"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      Dashboard
    </a>

    <a class="nav-item"
       routerLink="/tickets"
       routerLinkActive="active"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      Tickets
    </a>

    <a class="nav-item"
       routerLink="/calendar"
       routerLinkActive="active"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      Calendar
    </a>

    <a class="nav-item"
       routerLink="/my-department"
       routerLinkActive="active"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      My Department
    </a>

    <!-- Box Office group — visible to admin roles, box-office permission, or Box Office dept -->
    <ng-container *ngIf="isAuthenticated && canSeeBoxOffice">
      <div class="nav-group-label">Box Office</div>

      <a class="nav-item"
         routerLink="/box-office/bookings"
         routerLinkActive="active"
         (click)="onNavClick()">
        <span class="nav-dot"></span>
        Bookings
      </a>

      <a class="nav-item"
         routerLink="/box-office/registration"
         routerLinkActive="active"
         (click)="onNavClick()">
        <span class="nav-dot"></span>
        Registration
      </a>
    </ng-container>

    <!-- Accommodation group — Inventory visible broadly (Box-Office-style
         gate), Setup admin-only. See ACCOMMODATION_CONTEXT.md decision #9. -->
    <ng-container *ngIf="isAuthenticated && (canSeeAccommodationInventory || canSeeAccommodationSetup)">
      <div class="nav-group-label">Accommodation</div>

      <a class="nav-item"
         routerLink="/accommodation/inventory"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeAccommodationInventory">
        <span class="nav-dot"></span>
        Inventory
      </a>

      <a class="nav-item"
         routerLink="/accommodation/setup"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeAccommodationSetup">
        <span class="nav-dot"></span>
        Setup
      </a>
    </ng-container>

    <!-- Admin group — visible to DEV / DIR / ADMIN / TL -->
    <ng-container *ngIf="isAuthenticated && canSeeAdminMenu">
      <div class="nav-group-label">Admin</div>

      <a class="nav-item"
         routerLink="/admin/user"
         routerLinkActive="active"
         (click)="onNavClick()">
        <span class="nav-dot"></span>
        Users
      </a>

      <a class="nav-item"
         routerLink="/admin/tickets"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeTicketRegistry">
        <span class="nav-dot"></span>
        Tickets
      </a>

      <a class="nav-item"
         routerLink="/admin/departments"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeManageDepts">
        <span class="nav-dot"></span>
        Departments
      </a>

      <a class="nav-item"
         routerLink="/admin/events"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeManageEvents">
        <span class="nav-dot"></span>
        Events
      </a>
    </ng-container>

  </nav>

  <!-- Pushes user block to the bottom -->
  <div class="sidebar-spacer"></div>

  <!-- Active-Event selector — which event Box Office/Dashboard/Bookings/
       Ticket Registry are scoped to. Options are already role-filtered by
       the backend (TL/VOL only ever see 'active' events). -->
  <div class="sidebar-event-picker" *ngIf="isAuthenticated && events.length > 0">
    <label class="event-picker-label">Event</label>
    <select class="event-picker-select"
      [ngModel]="activeEvent?._id"
      (ngModelChange)="onEventChange($event)">
      <option *ngFor="let event of events" [value]="event._id">{{ event.name }}</option>
    </select>
  </div>

  <!-- User block at bottom -->
  <div class="sidebar-user" *ngIf="isAuthenticated">
    <a class="user-info" routerLink="/profile" (click)="onNavClick()" title="View profile">
      <div class="user-avatar">{{ userName.charAt(0) | uppercase }}</div>
      <div class="user-details">
        <div class="user-name-text">{{ userName }}</div>
        <div class="user-role-text">{{ userRole }}</div>
      </div>
    </a>
    <button mat-icon-button class="logout-btn" (click)="onLogOut()" aria-label="Logout" title="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>

  <div class="sidebar-version">v{{ appVersion }}</div>

</div>
