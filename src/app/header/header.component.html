<div class="sidebar">

  <!-- Logo block -->
  <div class="sidebar-logo">
    <div class="logo-name">Bloom in Green</div>
    <div class="logo-sub">BiG 6.0 · Jan 16–18</div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <button type="button" class="nav-group-label nav-group-toggle" (click)="toggleGroup('main')" [attr.aria-expanded]="isOpen('main')">
      Main<span class="nav-count" *ngIf="unreadNotes && !isOpen('main')" [attr.aria-label]="unreadNotes + ' unread on the Billboard'">{{ unreadNotes > 99 ? '99+' : unreadNotes }}</span><mat-icon class="nav-chev" [class.open]="isOpen('main')">expand_more</mat-icon>
    </button>
    <div class="nav-group-items" *ngIf="isOpen('main')">

      <a class="nav-item"
         routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="onNavClick()"
         *ngIf="isAuthenticated">
        <mat-icon class="nav-ic" aria-hidden="true">dashboard</mat-icon>
        Dashboard
      </a>

      <a class="nav-item"
         routerLink="/billboard"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="isAuthenticated">
        <mat-icon class="nav-ic" aria-hidden="true">push_pin</mat-icon>
        Billboard
        <span class="nav-count" *ngIf="unreadNotes" [attr.aria-label]="unreadNotes + ' unread'">{{ unreadNotes > 99 ? '99+' : unreadNotes }}</span>
      </a>

      <a class="nav-item"
         routerLink="/sos"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeSos">
        <mat-icon class="nav-ic" aria-hidden="true">sos</mat-icon>
        SOS
        <span class="nav-count sos-nav-count" *ngIf="openSos" [attr.aria-label]="openSos + ' open SOS'">{{ openSos }}</span>
      </a>

      <a class="nav-item"
         routerLink="/venue-map"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="isAuthenticated">
        <mat-icon class="nav-ic" aria-hidden="true">map</mat-icon>
        Venue Map
      </a>

      <a class="nav-item"
         routerLink="/my-department"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="isAuthenticated">
        <mat-icon class="nav-ic" aria-hidden="true">groups</mat-icon>
        My Department
      </a>
    </div>

    <!-- Navigation Tabs (NAV_TABS_CONTEXT.md): one item per section. Its pages are
         tabs in the section header; the item opens the tab used last there. -->
    <ng-container *ngIf="isAuthenticated">
      <div class="nav-sep" role="separator"></div>
      <ng-container *ngFor="let s of sections; trackBy: trackBySection">
        <a class="nav-item"
           *ngIf="nav.canSeeSection(s.key)"
           [routerLink]="sectionLinks[s.key]"
           [class.active]="activeSection === s.key"
           [attr.aria-current]="activeSection === s.key ? 'true' : null"
           (click)="onNavClick()">
          <mat-icon class="nav-ic" aria-hidden="true">{{ s.icon }}</mat-icon>
          {{ s.label }}
        </a>
      </ng-container>
    </ng-container>

  </nav>

  <!-- Pushes user block to the bottom -->
  <div class="sidebar-spacer"></div>

  <!-- Active-Event selector — which event Box Office/Dashboard/Bookings/
       Ticket Registry are scoped to. Options are already role-filtered by
       the backend (TL/VOL only ever see 'active' events). -->
  <div class="sidebar-event-picker" *ngIf="isAuthenticated && events.length > 0">
    <label class="event-picker-label">Event</label>
    <app-select
      [ngModel]="activeEvent?._id"
      (ngModelChange)="onEventChange($event)">
      <app-option *ngFor="let event of events" [value]="event._id">{{ event.name }}</app-option>
    </app-select>
  </div>

  <!-- User block at bottom -->
  <div class="sidebar-user" *ngIf="isAuthenticated">
    <a class="user-info" routerLink="/profile" (click)="onNavClick()" title="View profile">
      <app-user-avatar class="user-avatar" [userId]="userId" [name]="userName"
                       [version]="avatarVersion" [size]="28"></app-user-avatar>
      <div class="user-details">
        <div class="user-name-text">{{ userName }}</div>
        <div class="user-role-text">{{ userRole }}</div>
      </div>
    </a>
    <button mat-icon-button class="logout-btn" (click)="onLogOut()" aria-label="Logout" title="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>

  <div class="sidebar-version">v{{ appVersion }}</div>

</div>
