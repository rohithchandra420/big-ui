<div class="sidebar">

  <!-- Logo block -->
  <div class="sidebar-logo">
    <div class="logo-name">Bloom in Green</div>
    <div class="logo-sub">BiG 6.0 · Jan 16–18</div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <div class="nav-group-label">Main</div>

    <a class="nav-item"
       routerLink="/"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      Dashboard
    </a>

    <a class="nav-item"
       routerLink="/tickets"
       routerLinkActive="active"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      Tickets
    </a>

    <a class="nav-item"
       routerLink="/accomodation"
       routerLinkActive="active"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      Tenting
    </a>

    <a class="nav-item"
       routerLink="/calendar"
       routerLinkActive="active"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      Calendar
    </a>

    <a class="nav-item"
       routerLink="/my-department"
       routerLinkActive="active"
       (click)="onNavClick()"
       *ngIf="isAuthenticated">
      <span class="nav-dot"></span>
      My Department
    </a>

    <!-- Box Office group — visible to admin roles, box-office permission, or Box Office dept -->
    <ng-container *ngIf="isAuthenticated && canSeeBoxOffice">
      <div class="nav-group-label">Box Office</div>

      <a class="nav-item"
         routerLink="/box-office/bookings"
         routerLinkActive="active"
         (click)="onNavClick()">
        <span class="nav-dot"></span>
        Bookings
      </a>

      <a class="nav-item"
         routerLink="/box-office/registration"
         routerLinkActive="active"
         (click)="onNavClick()">
        <span class="nav-dot"></span>
        Registration
      </a>
    </ng-container>

    <!-- Admin group — visible to DEV / DIR / ADMIN / TL -->
    <ng-container *ngIf="isAuthenticated && canSeeAdminMenu">
      <div class="nav-group-label">Admin</div>

      <a class="nav-item"
         routerLink="/admin/user"
         routerLinkActive="active"
         (click)="onNavClick()">
        <span class="nav-dot"></span>
        Users
      </a>

      <a class="nav-item"
         routerLink="/admin/tickets"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeTicketRegistry">
        <span class="nav-dot"></span>
        Tickets
      </a>

      <a class="nav-item"
         routerLink="/admin/departments"
         routerLinkActive="active"
         (click)="onNavClick()"
         *ngIf="canSeeManageDepts">
        <span class="nav-dot"></span>
        Departments
      </a>
    </ng-container>

  </nav>

  <!-- Pushes user block to the bottom -->
  <div class="sidebar-spacer"></div>

  <!-- User block at bottom -->
  <div class="sidebar-user" *ngIf="isAuthenticated">
    <a class="user-info" routerLink="/profile" (click)="onNavClick()" title="View profile">
      <div class="user-avatar">{{ userName.charAt(0) | uppercase }}</div>
      <div class="user-details">
        <div class="user-name-text">{{ userName }}</div>
        <div class="user-role-text">{{ userRole }}</div>
      </div>
    </a>
    <button mat-icon-button class="logout-btn" (click)="onLogOut()" aria-label="Logout" title="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>

  <div class="sidebar-version">v{{ appVersion }}</div>

</div>
