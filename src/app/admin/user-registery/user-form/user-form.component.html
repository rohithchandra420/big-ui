<form [formGroup]="form" (ngSubmit)="submit()" class="user-form">

  <div class="field">
    <label>Name *</label>
    <input type="text" formControlName="userName" placeholder="Full name">
  </div>

  <div class="field">
    <label>Email *</label>
    <input type="email" formControlName="email" placeholder="email@example.com">
  </div>

  <ng-container *ngIf="!isEdit">
    <div class="form-two-col">
      <div class="field">
        <label>Password *</label>
        <input type="password" formControlName="password" placeholder="Min. 8 characters">
      </div>
      <div class="field">
        <label>Confirm Password *</label>
        <input type="password" formControlName="confirmPassword" placeholder="Repeat password">
      </div>
    </div>
    <div class="field-error" *ngIf="form.hasError('passwordMismatch')">Passwords do not match.</div>
  </ng-container>

  <div class="form-two-col">
    <div class="field">
      <label>Role *</label>
      <app-select formControlName="role">
        <app-option value="" [disabled]="true">Select a role</app-option>
        <app-option *ngFor="let r of roleOptions" [value]="r.name">{{ r.name }}</app-option>
      </app-select>
    </div>
    <div class="field">
      <label>Home Department *</label>
      <app-select formControlName="homeDepartment">
        <app-option value="" [disabled]="true">Select a department</app-option>
        <app-option *ngFor="let d of departments" [value]="d._id">{{ d.name }}</app-option>
      </app-select>
    </div>
  </div>

  <div class="field">
    <label>Date of Joining *</label>
    <input type="date" formControlName="dateOfJoining">
  </div>

  <div class="section-lbl">Department Access</div>
  <div class="dept-access-table">
    <div *ngFor="let dept of departments" class="dept-row">
      <span class="dept-name">{{ dept.name }}</span>
      <div class="chip-group">
        <button
          *ngFor="let level of permLevels"
          type="button"
          class="access-chip"
          [class.chip-read]="level === 'read' && deptSelections[dept._id] === level"
          [class.chip-write]="level === 'write' && deptSelections[dept._id] === level"
          [class.chip-manage]="level === 'manage' && deptSelections[dept._id] === level"
          [class.chip-inactive]="deptSelections[dept._id] !== level"
          (click)="setDeptLevel(dept._id, level)">
          {{ level | titlecase }}
        </button>
      </div>
    </div>
  </div>

  <div class="btn-row form-actions">
    <button class="btn-ghost" type="button" (click)="cancelled.emit()">Cancel</button>
    <button class="btn-cta" type="submit" [disabled]="form.invalid || saving">
      {{ isEdit ? 'Save Changes' : 'Create User' }}
    </button>
  </div>

</form>
