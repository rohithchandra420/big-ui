<form [formGroup]="form" (ngSubmit)="submit()" class="user-form">

  <div class="field">
    <label>Name *</label>
    <input type="text" formControlName="userName" placeholder="Full name">
  </div>

  <div class="field">
    <label>Email *</label>
    <input type="email" formControlName="email" placeholder="email@example.com">
  </div>

  <ng-container *ngIf="!isEdit">
    <div class="form-two-col">
      <div class="field">
        <label>Password *</label>
        <input type="password" formControlName="password" placeholder="Min. 8 characters">
      </div>
      <div class="field">
        <label>Confirm Password *</label>
        <input type="password" formControlName="confirmPassword" placeholder="Repeat password">
      </div>
    </div>
    <div class="field-error" *ngIf="form.hasError('passwordMismatch')">Passwords do not match.</div>
  </ng-container>

  <div class="form-two-col">
    <div class="field">
      <label>Role *</label>
      <app-select formControlName="role">
        <app-option value="" [disabled]="true">Select a role</app-option>
        <app-option *ngFor="let r of roleOptions; trackBy: trackRole" [value]="r.name">{{ r.name }}</app-option>
      </app-select>
    </div>
    <div class="field">
      <label>Home Department *</label>
      <app-select formControlName="homeDepartment">
        <app-option value="" [disabled]="true">Select a department</app-option>
        <app-option *ngFor="let d of departments" [value]="d._id">{{ d.name }}</app-option>
      </app-select>
    </div>
  </div>

  <div class="form-two-col">
    <div class="field">
      <label>Date of Joining *</label>
      <input type="date" formControlName="dateOfJoining">
    </div>
    <div class="field">
      <label>Food</label>
      <div class="food-opts" role="radiogroup" aria-label="Food preference">
        <button type="button" class="toggle-chip" role="radio"
                [class.on]="form.controls.foodPreference.value === 'veg'" [attr.aria-checked]="form.controls.foodPreference.value === 'veg'"
                (click)="form.controls.foodPreference.setValue('veg')"><span class="food-mark veg"></span>Veg</button>
        <button type="button" class="toggle-chip" role="radio"
                [class.on]="form.controls.foodPreference.value === 'non-veg'" [attr.aria-checked]="form.controls.foodPreference.value === 'non-veg'"
                (click)="form.controls.foodPreference.setValue('non-veg')"><span class="food-mark nonveg"></span>Non-veg</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="uf-phone">Phone</label>
    <input id="uf-phone" type="tel" formControlName="phone" maxlength="24" inputmode="tel" autocomplete="off" placeholder="e.g. +91 90000 00000">
    <div class="field-error" *ngIf="form.controls.phone.invalid">7 to 15 digits. A leading + is allowed.</div>
  </div>

  <div class="field">
    <label>Gender</label>
    <div class="food-opts" role="radiogroup" aria-label="Gender">
      <button type="button" class="toggle-chip" role="radio" *ngFor="let g of genders"
              [class.on]="form.controls.gender.value === g" [attr.aria-checked]="form.controls.gender.value === g"
              (click)="form.controls.gender.setValue(g)">{{ g }}</button>
    </div>
  </div>

  <div class="section-lbl">Extra access <span class="key-note">(on top of what their own department gives)</span></div>
  <div class="dept-access-table" *ngIf="accessKeys.length">
    <div *ngFor="let k of accessKeys; trackBy: trackKey" class="dept-row">
      <span class="dept-name" [title]="k.names ? 'Departments with this key: ' + k.names : 'No department has this key yet'">
        {{ k.label }} <span class="key-tag">{{ k.key }}</span>
      </span>
      <div class="chip-group">
        <button
          *ngFor="let t of k.tiers; trackBy: trackTier"
          type="button"
          class="access-chip"
          [title]="t.gives"
          [attr.aria-pressed]="keySelections[k.key] === t.tier"
          [class.chip-read]="t.tier === 'read' && keySelections[k.key] === t.tier"
          [class.chip-write]="t.tier === 'write' && keySelections[k.key] === t.tier"
          [class.chip-manage]="t.tier === 'manage' && keySelections[k.key] === t.tier"
          [class.chip-inactive]="keySelections[k.key] !== t.tier"
          (click)="setKeyLevel(k.key, t.tier)">
          {{ t.label }}
        </button>
      </div>
      <span class="key-gives" *ngIf="givesOf(k) as gives">{{ gives }}</span>
    </div>
  </div>
  <p class="key-none" *ngIf="!accessKeys.length">Your department's key gives no extra access to set.</p>

  <div class="btn-row form-actions">
    <button class="btn-ghost" type="button" (click)="cancelled.emit()">Cancel</button>
    <button class="btn-cta" type="submit" [disabled]="form.invalid || saving">
      {{ isEdit ? 'Save Changes' : 'Create User' }}
    </button>
  </div>

</form>
