<div class="section col-xs-12 col-sm-12 col-md-8 col-sm-offset-1 col-md-offset-2 mt-2">
    <div class="section-header-center col-lg-12 mb-3">
        <h2>{{ isEditMode ? 'Edit' : 'Register' }} User:</h2>
    </div>

    <div *ngIf="!canManageUsers" class="alert alert-warning">
        You do not have permission to manage users.
    </div>

    <form *ngIf="canManageUsers" [formGroup]="userFrom" (ngSubmit)="onSubmit()">
        <div class="form-group">
            <label for="userName">Name:</label>
            <input type="text" id="userName" formControlName="userName" class="form-control">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" formControlName="email" class="form-control">
        </div>
        <div class="form-group" *ngIf="!isEditMode">
            <label for="password">Password:</label>
            <input type="password" id="password" formControlName="password" class="form-control">
        </div>
        <div class="form-group" *ngIf="!isEditMode">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control">
        </div>

        <div class="form-group">
            <label for="role">Role:</label>
            <select class="form-select" formControlName="role" id="role">
                <option value="" disabled>Select a role</option>
                <option *ngFor="let r of roles" [value]="r.name">{{ r.name }}</option>
            </select>
        </div>

        <!-- Department Access -->
        <div class="dept-access-section mt-3">
            <label class="dept-access-label">Department Access</label>
            <div class="dept-access-list">
                <div *ngFor="let dept of departments" class="dept-row">
                    <span class="dept-name">{{ dept.name }}</span>
                    <div class="chip-group">
                        <button
                            *ngFor="let level of permLevels"
                            type="button"
                            class="chip"
                            [class.active]="deptSelections[dept._id] === level"
                            [class.chip-read]="level === 'read' && deptSelections[dept._id] === level"
                            [class.chip-write]="level === 'write' && deptSelections[dept._id] === level"
                            [class.chip-manage]="level === 'manage' && deptSelections[dept._id] === level"
                            (click)="setDeptLevel(dept._id, level)">
                            {{ level | titlecase }}
                        </button>
                    </div>
                    <span class="dept-status" *ngIf="deptSelections[dept._id] !== 'none'">
                        &#10003;
                    </span>
                </div>
            </div>
        </div>

        <div class="action-group">
            <div class="col-lg-4 col-md-4 col-xs-12 text-center">
                <button class="btn btn-success mr-3" type="submit" *ngIf="!isEditMode">
                    Create User
                </button>
                <button class="btn btn-primary mr-3" type="button" *ngIf="isEditMode"
                    (click)="switchMode()">
                    Switch to Register
                </button>
            </div>
            <div class="col-lg-4 col-md-4 col-xs-12 text-center">
                <button class="btn btn-success mr-3" type="button" [disabled]="!isEditMode"
                    (click)="updateUser()">Update User</button>
            </div>
            <div class="col-lg-4 col-md-4 col-xs-12 text-center">
                <button class="btn btn-danger" type="button" [disabled]="!isEditMode"
                    (click)="deleteUser()">Delete User</button>
            </div>
        </div>
    </form>
</div>

<div class="section col-lg-12">
    <div class="section-header-center col-lg-12 mb-3">
        <h2>Users:</h2>
    </div>
    <div class="row col-lg-12 col-sm-offset-1 col-md-offset-2">
        <mat-card class="user-card col-lg-4 col-md-5 col-xs-12" *ngFor="let u of userList">
            <mat-card-header class="text-center">
                <mat-card-title>{{ u.name }}</mat-card-title>
                <mat-card-subtitle>* {{ u.role?.name || u.role }} *</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content class="mb-2">
                <p>
                    <strong>Name: </strong> {{ u.name }}<br>
                    <strong>Email: </strong> {{ u.email }}<br>
                    <strong>Role: </strong> {{ u.role?.name || u.role }}<br>
                </p>
                <div *ngIf="u.permissions?.length">
                    <strong>Permissions:</strong>
                    <div class="perm-chips mt-1">
                        <span *ngFor="let p of u.permissions" class="perm-badge">{{ p }}</span>
                    </div>
                </div>
            </mat-card-content>
            <mat-card-actions *ngIf="canManageUsers">
                <button class="btn btn-primary" (click)="editUser(u)">Edit</button>
                <button class="btn btn-danger" (click)="deleteUser()">Delete</button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
