<div class="page-ph">
  <div>
    <div class="page-ph-title">Departments</div>
    <div class="page-ph-sub">{{ departments.length }} departments</div>
  </div>
  <button class="btn-cta" (click)="openCreateDialog()">+ Create Department</button>
</div>

<div class="dept-page">

  <div *ngIf="loading" class="loading-wrap">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <div *ngIf="!loading && departments.length === 0" class="empty-state">
    <mat-icon class="empty-icon">domain</mat-icon>
    <p>No departments yet. Create one to get started.</p>
  </div>

  <div class="dept-grid" *ngIf="!loading && departments.length > 0">
    <div class="dept-card" *ngFor="let dept of departments">

      <div class="dept-card-hd">
        <span class="dept-name">{{ dept.name }}</span>
      </div>

      <div class="dept-card-body">
        <p class="dept-desc" *ngIf="dept.description">{{ dept.description }}</p>
        <p class="dept-desc muted" *ngIf="!dept.description">No description</p>

        <div class="meta-row">
          <span class="meta-label">TL</span>
          <span class="meta-value">
            <span class="tl-list" *ngIf="dept.tls.length; else noTl">
              <span class="tl-item" *ngFor="let t of dept.tls">
                <app-user-avatar [userId]="t._id" [name]="t.name" [version]="t.avatarVersion" [size]="18"></app-user-avatar>
                {{ t.name }}
              </span>
            </span>
            <ng-template #noTl>—</ng-template>
          </span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Volunteers</span>
          <span class="meta-value">{{ dept.volunteerCount }}</span>
        </div>
      </div>

      <div class="dept-card-actions">
        <button class="btn-sm-outline" (click)="editDepartment(dept)">Edit</button>
        <button class="btn-sm-danger" (click)="openDeleteDialog(dept)"
          [disabled]="deletingId === dept._id">
          {{ deletingId === dept._id ? 'Deleting…' : 'Delete' }}
        </button>
      </div>

    </div>
  </div>

</div>
