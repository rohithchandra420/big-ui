<h2 mat-dialog-title class="delete-title">Delete "{{ data.deptName }}"?</h2>

<mat-dialog-content>
  <ng-container *ngIf="data.users.length > 0; else emptyDept">
    <p class="warning-text">
      <mat-icon class="warn-icon">warning</mat-icon>
      <strong>{{ data.users.length }} user(s) will be unassigned:</strong>
    </p>
    <ul class="user-list">
      <li *ngFor="let u of data.users">{{ u.name }}</li>
    </ul>
    <p class="sub-note">Their department membership and matching permissions will be removed.</p>
  </ng-container>
  <ng-template #emptyDept>
    <p>Are you sure you want to delete this department? This cannot be undone.</p>
  </ng-template>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button class="btn-delete" (click)="confirm()">
    {{ data.users.length > 0 ? 'Unassign All &amp; Delete' : 'Delete' }}
  </button>
</mat-dialog-actions>

<style>
  .delete-title { color: #EF4444; }
  .warning-text { display: flex; align-items: center; gap: 6px; color: #b91c1c; }
  .warn-icon { color: #F59E0B; font-size: 20px; height: 20px; width: 20px; }
  .user-list { margin: 4px 0 8px 20px; color: #374151; }
  .sub-note { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .btn-delete { background: #EF4444; color: #fff; }
</style>
