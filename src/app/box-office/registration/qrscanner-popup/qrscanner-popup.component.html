<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <p class="scan-for" *ngIf="mode === 'band' && attendeeName">Scan the wrist band for <strong>{{ attendeeName }}</strong></p>

  <!-- Hidden, not removed, while paused — Scan again restarts the same camera. -->
  <div [class.camera-hidden]="paused">
    <ngx-scanner-qrcode #action="scanner" [config]="config" (event)="onEvent($event, action)"></ngx-scanner-qrcode>
  </div>

  <p *ngIf="action.isLoading" class="scan-loading">Loading camera…</p>
  <p *ngIf="paused && !band && !message" class="scan-loading">Checking the band…</p>
  <div class="alert scan-msg" [class.ad]="!isError" [class.aw]="isError" *ngIf="message" role="alert">{{ message }}</div>

  <app-band-alert *ngIf="band?.state === 'replaced'" [band]="band!"></app-band-alert>

  <div class="alert as band-result" *ngIf="bandOk && band" role="status">
    <div class="band-result-lbl">{{ isOwnBand ? 'This band is already theirs' : 'New band' }}</div>
    <div class="band-result-val">{{ band.code }}</div>
  </div>

  <div class="field band-reason" *ngIf="bandOk && purpose === 'replace'">
    <label for="band-reason">Reason</label>
    <input id="band-reason" type="text" maxlength="200" [(ngModel)]="reason"
           placeholder="e.g. Band broke, lost at the stage">
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <!-- App-wide rule: Cancel leftmost, main action rightmost -->
  <button class="btn-ghost" (click)="close()">Cancel</button>
  <button class="btn-secondary" *ngIf="canScanAgain" (click)="scanAgain()">Scan again</button>
  <ng-container *ngIf="paused">
    <button class="btn-secondary" (click)="scanBandAgain()">Scan again</button>
    <button class="btn-danger" *ngIf="mode === 'booking' && band?.state === 'replaced' && band?.owner?.ticketId"
            (click)="openFlaggedBooking()">Checked: open {{ band?.owner?.name || 'their' }}'s booking</button>
    <button class="btn-cta" *ngIf="mode === 'band' && bandOk"
            [disabled]="purpose === 'replace' && !reason.trim()" (click)="confirmBand()">{{ confirmLabel }}</button>
  </ng-container>
</mat-dialog-actions>
