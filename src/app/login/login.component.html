
<div class="login-page">
  <div class="login-card">

    <!-- Brand mark -->
    <div class="brand-mark">
      <div class="brand-logo">BiG</div>
      <div class="brand-name">Bloom in Green</div>
      <div class="brand-sub">6.0 &middot; Jan 16&ndash;18, 2026</div>
    </div>

    <!-- Form -->
    <form class="login-form" #loginForm="ngForm">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" name="username" required autocomplete="username">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [(ngModel)]="password" type="password" name="password" required autocomplete="current-password">
      </mat-form-field>

      <div class="login-error" *ngIf="loginError">
        <mat-icon class="error-icon">error_outline</mat-icon>
        <span>{{ loginError }}</span>
      </div>

      <button class="btn-login" (click)="login()" [disabled]="!loginForm.valid">
        Sign In
      </button>

    </form>
  </div>
</div>
