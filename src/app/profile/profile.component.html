<div class="profile-container">

  <mat-card class="profile-card">

    <!-- Header -->
    <div class="profile-header">
      <div class="profile-img-wrapper">
        <img [src]="profilePreview" class="profile-img">
        <input type="file" *ngIf="isEditMode" (change)="onFileSelect($event)" />
      </div>
      <div class="profile-title">
        <h2>My Profile</h2>
        <button mat-raised-button color="primary" (click)="toggleEdit()">
          {{ isEditMode ? 'Cancel' : 'Edit' }}
        </button>
      </div>
    </div>

    <!-- Basic Info Form -->
    <form [formGroup]="profileForm" class="profile-form">

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" [readonly]="!isEditMode">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phone" [readonly]="!isEditMode">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <mat-error *ngIf="profileForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="profileForm.get('email')?.hasError('email')">Invalid email</mat-error>
          <input matInput formControlName="email" [readonly]="!isEditMode">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Role</mat-label>
          <input matInput formControlName="role" readonly>
        </mat-form-field>
      </div>

    </form>

    <!-- DEV / DIR: full access badge -->
    <div *ngIf="isSuperuser" class="alert alert-success mt-3">
      <strong>Full Access</strong> — No department restrictions apply to this role.
    </div>

    <ng-container *ngIf="!isSuperuser">

      <!-- Department membership -->
      <div class="dept-matrix-section mt-3">
        <h3>Department</h3>
        <p *ngIf="memberDepartments.length === 0" class="text-muted">No department assigned.</p>
        <div class="perm-chips" *ngIf="memberDepartments.length > 0">
          <span class="perm-badge" *ngFor="let dept of memberDepartments">{{ dept }}</span>
        </div>
      </div>

      <!-- Effective permissions -->
      <div class="dept-matrix-section mt-3">
        <h3>Permissions</h3>
        <p *ngIf="permissionEntries.length === 0" class="text-muted">No permissions assigned.</p>

        <div class="dept-access-list" *ngIf="permissionEntries.length > 0">
          <div class="dept-row" *ngFor="let entry of permissionEntries">
            <span class="dept-name">{{ entry.displayName }}</span>
            <span class="chip" [ngClass]="'chip-' + entry.level">{{ entry.level }}</span>
          </div>
        </div>
      </div>

    </ng-container>

    <!-- Save Button -->
    <div class="actions mt-3" *ngIf="isEditMode">
      <button mat-raised-button color="accent" (click)="saveProfile()">
        Save Changes
      </button>
    </div>

  </mat-card>

</div>
